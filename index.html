
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternTrack | Application Manager</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">InternTrack</div>
        <p>Track your internship journey.</p>
    </header>

    <main class="container">

        <!-- Dashboard -->
        <section class="dashboard">
            <h2>Dashboard Overview</h2>

            <div class="stats-container">
                <div class="stat-card">
                    <h3>Total Applications</h3>
                    <p id="totalApplications">0</p>
                </div>

                <div class="stat-card">
                    <h3>Interviews</h3>
                    <p id="totalInterviews">0</p>
                </div>

                <div class="stat-card">
                    <h3>Offers</h3>
                    <p id="totalOffers">0</p>
                </div>

                <div class="stat-card">
                    <h3>Rejected</h3>
                    <p id="totalRejected">0</p>
                </div>
            </div>
        </section>

        <!-- Add Application Form -->
        <section class="form-section">
            <h2>Add New Application</h2>

            <form id="applicationForm">

                <input type="text" id="company"
                    placeholder="Company Name" required>

                <input type="text" id="role"
                    placeholder="Job Role" required>

                <input type="text" id="location"
                    placeholder="Location">

                <select id="status">
                    <option value="Applied">Applied</option>
                    <option value="Interview">Interview</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                </select>

                <input type="url" id="jobLink"
                    placeholder="Job Link">

                <textarea id="notes"
                    placeholder="Additional Notes"></textarea>

                <button type="submit">Add Application</button>
                <button type="button" id="cancelEdit" style="display: none;">
                    Cancel Edit
                </button>

            </form>

            <p id="formMessage"></p>
        </section>

        <!-- Application List -->
        <section class="applications-section">
            <h2>Your Applications</h2>

            <div class="filters">
                <input type="text" id="searchCompany"
                    placeholder="Search by company">

                <select id="filterStatus">
                    <option value="">All Statuses</option>
                    <option value="Applied">Applied</option>
                    <option value="Interview">Interview</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>

            <p id="loadingMessage">Loading applications...</p>
            <p id="errorMessage"></p>

            <div id="applicationsList"></div>
        </section>

    </main>

    <!-- JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
